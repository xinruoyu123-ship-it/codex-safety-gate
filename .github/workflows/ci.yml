name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-safe-tests:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Confirm source checkout excludes bundled runtime
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'runtime\pwsh') {
            throw 'runtime/pwsh must be assembled for releases, not committed to source.'
          }

      - name: Run static security regression
        shell: pwsh
        run: pwsh -NoProfile -File .\tests\Run-StaticTests.ps1

      - name: Run GUI state regression
        shell: pwsh
        run: pwsh -NoProfile -File .\tests\Run-GuiSmokeTests.ps1

      - name: Run source-checkout launcher smoke test
        shell: pwsh
        run: pwsh -NoProfile -File .\tests\Run-LauncherTests.ps1

      - name: Validate VM provisioning contract
        shell: pwsh
        run: pwsh -NoProfile -File .\tests\Run-VmProvisioningTests.ps1

      - name: Import pinned portable PowerShell runtime
        shell: pwsh
        run: pwsh -NoProfile -File .\tools\release\Get-CsgRuntime.ps1

      - name: Build and verify publishable release archive
        shell: pwsh
        run: |
          $archive = Join-Path $PWD '.devtools\runtime\PowerShell-7.6.4-win-x64.zip'
          pwsh -NoProfile -File .\tools\release\Build-CsgRelease.ps1 -RuntimeArchivePath $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content .\dist\release-report.json -Raw | ConvertFrom-Json
          if (-not $report.release_eligible) { throw 'CI release archive was not marked publishable.' }
